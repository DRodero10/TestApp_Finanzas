<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Finanzas</title>
  <meta name="theme-color" content="#121211">
  <!-- iPhone: instalable con Compartir → Añadir a pantalla de inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>

  <button id="fab" data-act="add" aria-label="Añadir movimiento">+</button>

  <nav id="tabs">
    <button data-act="tab" data-tab="mes">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Mes</button>
    <button data-act="tab" data-tab="anio">
      <svg viewBox="0 0 24 24"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9M3 20.5h18"/></svg>Año</button>
    <button data-act="tab" data-tab="coche">
      <svg viewBox="0 0 24 24"><path d="M4 16v-3.5L6 7.5A2 2 0 0 1 7.9 6h8.2A2 2 0 0 1 18 7.5l2 5V16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM4 12.5h16"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></svg>Coche</button>
    <button data-act="tab" data-tab="ahorros">
      <svg viewBox="0 0 24 24"><path d="M5 11.5a7 6 0 0 1 12.3-3.9l2.2-.9-.5 2.6a6 6 0 0 1 1 3.2v1.5l-2 .6-1.4 2.6V20h-2.6v-1.4h-4V20H7.4v-2.1A6.2 6.2 0 0 1 5 13M9.5 7.2h4"/><circle cx="15.5" cy="11" r=".6"/></svg>Ahorros</button>
    <button data-act="tab" data-tab="ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>Ajustes</button>
  </nav>

  <div id="sheet" class="hidden">
    <div class="backdrop" data-act="close"></div>
    <div class="panel" id="panel"></div>
  </div>

  <div id="tip" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <script src="app.js"></script>
</body>
</html>
